name: Music List Sync

on:
  push:
    branches:
      - main
    paths:
      - "musics/**"
      - "lrc/**"
      - "test.py"
      - ".github/workflows/music-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-list-sync
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate musicList.json
        env:
          CI: "true"
          SKIP_LRC_GENERATION: "true"
          REQUIRE_LRC: "true"
          DISABLE_BAK: "true"
        run: python test.py

      - name: Check diff
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- musicList.json musics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated music data
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musicList.json musics
          git commit -m "chore: auto update music data"
          git push

      # No blog dispatch: the blog player fetches musicList.json directly at
      # page runtime, so pushing the regenerated JSON is the whole job.
